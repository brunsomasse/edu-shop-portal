name: Supabase Keep-Alive & Build Check

on:
  schedule:
    - cron: '0 8 */4 * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-and-ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify no .env files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env'; then
            echo "Error: .env file tracked in git!"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Ping Supabase REST API
        if: secrets.VITE_SUPABASE_URL != ''
        run: |
          curl -fsS -o /dev/null \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/"
